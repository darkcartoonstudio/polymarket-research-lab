<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">A research pipeline for prediction markets</title><desc id="desc">Market feeds and metadata flow through validation and timestamp alignment, then into a historical replay and separated prediction, execution, and expectancy checks.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081326"/><stop offset="1" stop-color="#151a38"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7f9bff"/></marker></defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<text x="54" y="52" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">OPEN PREDICTION-MARKET RESEARCH</text><text x="54" y="79" fill="#aebbe0" font-family="Inter,Arial,sans-serif" font-size="14">From raw events to claims that can survive scrutiny</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="45" y="125" width="200" height="95" rx="14" fill="#142544" stroke="#4866a7"/><text x="145" y="158" text-anchor="middle" fill="#d9e5ff" font-size="16" font-weight="700">1 · Observe</text><text x="145" y="183" text-anchor="middle" fill="#c0cce8" font-size="12">Prices · odds · L2 book</text><text x="145" y="201" text-anchor="middle" fill="#c0cce8" font-size="12">Market metadata</text>
<path d="M248 172 H290" stroke="#7f9bff" stroke-width="3" marker-end="url(#arr)"/>
<rect x="300" y="125" width="205" height="95" rx="14" fill="#142544" stroke="#4866a7"/><text x="402" y="158" text-anchor="middle" fill="#d9e5ff" font-size="16" font-weight="700">2 · Validate</text><text x="402" y="183" text-anchor="middle" fill="#c0cce8" font-size="12">Freshness · clocks</text><text x="402" y="201" text-anchor="middle" fill="#c0cce8" font-size="12">Gaps · official outcome</text>
<path d="M508 172 H548" stroke="#7f9bff" stroke-width="3" marker-end="url(#arr)"/>
<rect x="558" y="125" width="205" height="95" rx="14" fill="#142544" stroke="#4866a7"/><text x="660" y="158" text-anchor="middle" fill="#d9e5ff" font-size="16" font-weight="700">3 · Replay</text><text x="660" y="183" text-anchor="middle" fill="#c0cce8" font-size="12">Time-correct features</text><text x="660" y="201" text-anchor="middle" fill="#c0cce8" font-size="12">Fees · fills · resolution</text>
<path d="M766 172 H806" stroke="#7f9bff" stroke-width="3" marker-end="url(#arr)"/>
<rect x="816" y="112" width="338" height="120" rx="14" fill="#172a35" stroke="#28a78b"/><text x="985" y="145" text-anchor="middle" fill="#a8ffe6" font-size="16" font-weight="700">4 · Evaluate separately</text><text x="985" y="170" text-anchor="middle" fill="#d1f5eb" font-size="13">O1 · Direction / calibration</text><text x="985" y="191" text-anchor="middle" fill="#d1f5eb" font-size="13">O2 · Execution / fills</text><text x="985" y="212" text-anchor="middle" fill="#d1f5eb" font-size="13">Net expectancy / robustness</text>
<rect x="45" y="270" width="1109" height="98" rx="14" fill="#241e2e" stroke="#af6a8e"/><text x="72" y="303" fill="#ffd7e8" font-size="16" font-weight="700">Publication gate</text><text x="72" y="330" fill="#ead8e3" font-size="13">State sample size, exclusions, assumptions, uncertainty, and what was not tested. A good-looking score is not proof of an edge.</text><text x="72" y="350" fill="#ead8e3" font-size="13">Backtest ≠ out-of-sample validation ≠ live execution.</text>
</g></svg>
